name: Build and Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-desktop:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            script: dist:linux
          - os: windows-latest
            platform: win
            arch: x64
            script: dist:win
          - os: macos-latest
            platform: mac
            arch: arm64
            script: dist:mac-arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
            script: dist:mac-x64
    # Build jobs run third-party install/build code (dependency lifecycle
    # scripts, electron-builder). They must never see a write-capable token:
    # job-level read-only permissions and no GH_TOKEN/GITHUB_TOKEN env.
    # The release job owns publishing.
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        working-directory: apps/qwen-cowork
        # Frozen lockfile pins every transitive version; --ignore-scripts
        # keeps dependency lifecycle scripts (and the project postinstall)
        # from running install-time code in CI. Only Electron's own binary
        # installation is restored from the lockfile-installed package below.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Electron binary and rebuild native modules
        working-directory: apps/qwen-cowork
        # @electron/rebuild is a transitive dependency of electron-builder;
        # its lockfile-installed bin also triggers Electron's own install.js.
        run: bun run electron-rebuild -f -w better-sqlite3

      - name: Build Desktop
        working-directory: apps/qwen-cowork
        # No publish config exists in electron-builder.json and no token is
        # in this job, so electron-builder cannot publish from the matrix.
        run: bun run ${{ matrix.script }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/qwen-cowork/dist/*.dmg
            apps/qwen-cowork/dist/*.AppImage
            apps/qwen-cowork/dist/*.exe
          if-no-files-found: error

  release:
    needs: [build-desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # Only the release job holds the write token, and only after a human
    # approves the deployment in the protected environment.
    permissions:
      contents: write
    environment: release
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download All Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Release Assets
        run: |
          echo "Release assets:"
          ls -la release-assets/

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # Draft first: a maintainer verifies the assets and checksums, then
          # publishes manually. A poisoned build cannot go straight to users.
          draft: true
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
